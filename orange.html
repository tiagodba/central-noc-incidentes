<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central NOC</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ff7600;font-family:Arial,sans-serif}#app{width:100%;height:100%;border:0;display:block;background:#fff}
</style>
</head>
<body>
<iframe id="app" src="/legacy" title="Central NOC"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    if(!d||d.getElementById('central-noc-orange-theme'))return;
    const s=d.createElement('style');
    s.id='central-noc-orange-theme';
    s.textContent=`
html,body{min-height:100%!important;background:#f4f7fb!important;color:#172033!important}
#loginView{position:fixed!important;inset:0!important;width:100%!important;max-width:none!important;height:100vh!important;margin:0!important;padding:0!important;display:flex!important;align-items:center!important;justify-content:center!important;overflow:hidden!important;background:radial-gradient(circle at 13% 20%,rgba(255,255,255,.09) 0 54px,transparent 56px),radial-gradient(circle at 84% 18%,rgba(255,255,255,.07) 0 42px,transparent 44px),linear-gradient(118deg,#ffb000 0%,#ff9200 40%,#ff6500 72%,#ff5200 100%)!important}
#loginView::before{content:'CENTRAL NOC';position:absolute;top:19%;left:50%;transform:translateX(-50%);z-index:2;color:#fff;font-weight:900;font-size:clamp(32px,4vw,58px);letter-spacing:.055em;white-space:nowrap;text-shadow:0 8px 28px rgba(123,45,0,.18)}
#loginView::after{content:'';position:absolute;right:-170px;bottom:-230px;width:540px;height:540px;border-radius:50%;border:44px solid rgba(255,255,255,.14);box-shadow:0 0 0 48px rgba(255,255,255,.075),0 0 0 96px rgba(255,255,255,.04)}
#loginView .login{position:relative!important;z-index:3!important;width:min(390px,calc(100vw - 34px))!important;margin:80px 0 0!important;padding:30px!important;background:#fff!important;color:#172033!important;border:0!important;border-radius:14px!important;box-shadow:0 28px 75px rgba(118,45,0,.28)!important}
#loginView .login h2{color:#141b2d!important;font-size:25px!important;margin:0 0 8px!important}
#loginView .login h2::after{content:'Gestão Operacional de Incidentes';display:block;margin-top:6px;font-size:12px;font-weight:600;color:#667085}
#loginView label{color:#344054!important}
#loginView input{background:#fff!important;color:#172033!important;border:1px solid #cbd3df!important;border-radius:8px!important;min-height:46px!important}
#loginView input:focus{border-color:#ff7900!important;box-shadow:0 0 0 3px rgba(255,121,0,.13)!important}
#loginView .primary{width:100%!important;margin-top:10px!important;background:linear-gradient(135deg,#ff9700,#ff6200)!important;border-radius:8px!important;box-shadow:0 9px 22px rgba(255,98,0,.24)!important}
#loginView .err{color:#c62828!important}
#appView{max-width:1600px!important;background:#f4f7fb!important;color:#172033!important;min-height:100vh!important}
#appView .top{background:linear-gradient(118deg,#ff9d00,#ff6800)!important;border:0!important;box-shadow:0 12px 30px rgba(255,105,0,.18)!important}
#appView .top h1{color:#fff!important}
#appView .top .sub,#appView .top .userbox .sub{color:rgba(255,255,255,.9)!important}
#appView .top .ghost{border-color:rgba(255,255,255,.55)!important;color:#fff!important;background:rgba(255,255,255,.10)!important}
#appView .stat,#appView .panel{background:#fff!important;border:1px solid #e5eaf1!important;box-shadow:0 10px 28px rgba(16,24,40,.07)!important}
#appView .stat span{color:#7b8799!important}#appView .stat b,#appView .panel h2{color:#172033!important}
#appView label{color:#596579!important}
#appView input,#appView select,#appView textarea{background:#fff!important;color:#172033!important;border:1px solid #ccd5e1!important}
#appView input:focus,#appView select:focus,#appView textarea:focus{border-color:#ff7a00!important;box-shadow:0 0 0 3px rgba(255,122,0,.10)!important}
#appView .topobox,#appView .topocard{background:#fffaf5!important;border-color:#ffd3aa!important}
#appView .tablewrap{background:#fff!important;border-color:#e6eaf0!important}#appView table{color:#172033!important}
#appView th{background:#fff3e8!important;color:#954600!important;border-bottom:1px solid #ffd9b5!important}#appView td{border-bottom:1px solid #edf0f4!important}
#appView tbody tr:hover{background:#fffaf6!important}#appView .ghost{color:#334155!important;background:#fff!important;border:1px solid #d7dee8!important}
#appView .primary{background:linear-gradient(135deg,#ff9500,#ff6800)!important}
#appView .modalbox{background:#fff!important;color:#172033!important;border-color:#e1e6ee!important;box-shadow:0 30px 80px rgba(0,0,0,.28)!important}
#appView .modalbox label{color:#596579!important}#appView .notice{background:#effcf5!important;border-color:#b9ebcf!important;color:#167546!important}
.ficha:not(.green){border-color:#e04c56!important;background:#fff!important}.ficha:not(.green) .fhead{background:#fff0f1!important;color:#c5313d!important}
.ficha.green{border-color:#19a963!important;background:#f3fff7!important}.ficha.green .fhead{background:linear-gradient(135deg,#22c55e,#15803d)!important;color:#fff!important}
@media(max-width:680px){#loginView::before{top:11%;font-size:30px}#loginView .login{margin-top:48px!important;padding:22px!important}#appView{padding:9px!important}}
`;
    d.head.appendChild(s);
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
