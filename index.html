 try{

}

`;d.head.appendChild(s);
  }
  const user=d.getElementById('username');
  const pass=d.getElementById('password');
  const btn=d.getElementById('loginBtn');
  const enterLogin=(e)=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();btn?.click();}};
  [user,pass].forEach(el=>{if(el&&!el.dataset.enterBound){el.addEventListener('keydown',enterLogin);el.dataset.enterBound='1';}});
  setTimeout(()=>{if(user&&user.value)pass?.focus();else user?.focus();},50);
 }catch(e){console.error(e)}
});
