name: "Ajuste card de abertura Central NOC"

"on":
  push:
    paths:
      - ".github/workflows/fix-responsive.yml"

permissions:
  contents: write

jobs:
  opening-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover motivo do card de abertura
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = "[\"SLA\",sla(i)],[\"MOTIVO\",i.motivo||'-','span2'],[\"OBSERVAÇÕES\",i.observacoes||'-','span4']"
          new = "[\"SLA\",sla(i)],[\"OBSERVAÇÕES\",i.observacoes||'-','span4']"
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove motivo do card de abertura"
          git push
