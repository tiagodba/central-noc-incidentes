name: "Corrigir normalização Central NOC"

"on":
  push:
    paths:
      - ".github/workflows/fix-responsive.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir fluxo de normalização
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '<option>AGUARDANDO</option><option>NORMALIZADO</option><option>CANCELADO</option>',
              '<option>AGUARDANDO</option><option value="NORMALIZADO" disabled>NORMALIZADO (use o botão Normalizar)</option><option>CANCELADO</option>',
              1
          )

          s = s.replace(
              '<div class="field full"><label>Observações</label><textarea id="observacoes"></textarea></div><div class="full"><button class="btn primary" type="submit">Salvar incidente</button> <button class="btn ghost" type="button" id="clearBtn">Limpar</button></div>',
              '<div class="field full"><label>Observações</label><textarea id="observacoes"></textarea></div><div class="full"><button class="btn primary" type="submit">Salvar incidente</button> <button class="btn success" type="button" id="normalizeFormBtn">Normalizar incidente</button> <button class="btn ghost" type="button" id="clearBtn">Limpar</button></div>',
              1
          )

          old_open = "function openNorm(id){let i=inc.find(x=>x.id===id);if(!i)return alert('Incidente não encontrado.');resolveId.value=id;resTermino.value=local(new Date());resMotivo.value='';resOutro.value='';resOutroWrap.classList.add('hidden');resLat.value=i.latitude??'';resLong.value=i.longitude??'';resObs.value=i.observacao_final||'';resolveModal.classList.remove('hidden')}"
          new_open = "function openNorm(id){let i=inc.find(x=>String(x.id)===String(id));if(!i)return alert('Incidente não encontrado.');if(i.status==='NORMALIZADO')return alert('Este incidente já está normalizado.');resolveId.value=i.id;resTermino.value=(dbId.value&&String(dbId.value)===String(i.id)&&termino.value)?termino.value:local(new Date());let currentMotivo=(dbId.value&&String(dbId.value)===String(i.id))?motivo.value:'';resMotivo.value=currentMotivo&&currentMotivo!=='OUTROS'?currentMotivo:'';resOutro.value=currentMotivo==='OUTROS'?motivo_outro.value:'';resOutroWrap.classList.toggle('hidden',currentMotivo!=='OUTROS');resLat.value=(dbId.value&&String(dbId.value)===String(i.id)&&latitude.value!=='')?latitude.value:(i.latitude??'');resLong.value=(dbId.value&&String(dbId.value)===String(i.id)&&longitude.value!=='')?longitude.value:(i.longitude??'');resObs.value=i.observacao_final||observacoes.value||'';status.value=i.status||'ABERTO';resolveModal.classList.remove('hidden')}"
          if old_open in s:
              s = s.replace(old_open, new_open, 1)

          old_bind = "loginBtn.onclick=login;logoutBtn.onclick=()=>{sessionStorage.clear();location.reload()};form.onsubmit=save;clearBtn.onclick=clearForm;addTopoBtn.onclick=()=>addTopo();"
          new_bind = "loginBtn.onclick=login;logoutBtn.onclick=()=>{sessionStorage.clear();location.reload()};form.onsubmit=save;normalizeFormBtn.onclick=()=>{if(!dbId.value)return alert('Salve ou abra um incidente antes de normalizar.');openNorm(dbId.value)};clearBtn.onclick=clearForm;addTopoBtn.onclick=()=>addTopo();"
          if old_bind in s:
              s = s.replace(old_bind, new_bind, 1)

          old_status = "status.onchange=()=>{if(status.value==='NORMALIZADO'){if(dbId.value){status.value=editOriginalStatus||'ABERTO';openNorm(dbId.value)}else{status.value='ABERTO';alert('Para normalizar, salve o incidente e use o botão Normalizar.')}}};"
          new_status = "status.onchange=()=>{editOriginalStatus=status.value||editOriginalStatus};"
          if old_status in s:
              s = s.replace(old_status, new_status, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrige fluxo de normalização do incidente"
          git push
